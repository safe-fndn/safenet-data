name: Setup IPFS
description: Install a pinned Kubo IPFS CLI on a Linux amd64 runner.

inputs:
  version:
    description: Kubo release version, including the v prefix.
    default: v0.43.1
  sha256:
    description: Expected SHA-256 checksum of the Linux amd64 release archive.
    required: true

runs:
  using: composite
  steps:
    - name: Install Kubo
      shell: bash
      env:
        KUBO_VERSION: ${{ inputs.version }}
        KUBO_SHA256: ${{ inputs.sha256 }}
      run: |
        [[ "$KUBO_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$KUBO_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
        download=$(mktemp -d "$RUNNER_TEMP/kubo-download.XXXXXX")
        archive="kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
        url="https://github.com/ipfs/kubo/releases/download/$KUBO_VERSION/$archive"
        curl --fail --location --silent --show-error --retry 3 "$url" -o "$download/$archive"
        (cd "$download" && printf '%s  %s\n' "$KUBO_SHA256" "$archive" | sha256sum --check)
        tar -xzf "$download/$archive" -C "$download" kubo/ipfs
        mkdir -p "$RUNNER_TEMP/ipfs-bin"
        install -m 755 "$download/kubo/ipfs" "$RUNNER_TEMP/ipfs-bin/ipfs"
        echo "$RUNNER_TEMP/ipfs-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/ipfs-bin/ipfs" version
