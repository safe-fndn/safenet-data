name: Safenet Staking Scripts
description: Run a staking-scripts command with the Aegis configuration and workspace mounted.

inputs:
  command:
    description: Staking-scripts command to execute.
    required: true
  args:
    description: Command arguments as a JSON array of strings (container paths use /workspace).
    default: '[]'
  image:
    description: Docker image to run.
    default: ghcr.io/safe-fndn/safenet-staking-scripts:main
  debug:
    description: Enable Safenet debug logging (always enabled when the run has GitHub Actions debug logging enabled).
    default: 'false'
  stdout-file:
    description: Optional host path to also capture stdout to (it is still echoed to the job log); its parent directory must exist.
    default: ''

runs:
  using: composite
  steps:
    - name: Run command
      # Python parses the JSON arguments into an argument list, preserving spaces
      # and special characters without shell splitting or evaluation.
      shell: python
      env:
        SCRIPT_COMMAND: ${{ inputs.command }}
        SCRIPT_ARGS: ${{ inputs.args }}
        SCRIPT_IMAGE: ${{ inputs.image }}
        SCRIPT_DEBUG: ${{ inputs.debug == 'true' || runner.debug == '1' }}
        SCRIPT_STDOUT: ${{ inputs.stdout-file }}
      run: |
        import json
        import os
        import subprocess
        import sys

        args = json.loads(os.environ['SCRIPT_ARGS'])
        if not isinstance(args, list) or not all(isinstance(arg, str) for arg in args):
            raise ValueError('args must be a JSON array of strings')

        workspace = os.environ['GITHUB_WORKSPACE']
        command = [
            'docker', 'run', '--rm',
            '-v', f'{workspace}:/workspace',
            '--env-file', f'{workspace}/config/aegis.env',
            '-e', 'DATABASE_FILE=/workspace/safenet.aegis.db',
            '-e', 'DEBUG=safenet,safenet:*' if os.environ['SCRIPT_DEBUG'] == 'true' else 'DEBUG=',
            '-e', 'GITHUB_TOKEN',
        ]
        # Secret overrides for config/aegis.env values, forwarded only when set.
        for name in ['IPFS_GATEWAY_URL']:
            if os.environ.get(name):
                command += ['-e', name]
        command += [os.environ['SCRIPT_IMAGE'], os.environ['SCRIPT_COMMAND'], *args]
        output = os.environ['SCRIPT_STDOUT']
        if not output:
            sys.exit(subprocess.run(command).returncode)

        # Tee stdout to both the file and the job log, so that output preceding
        # a failure is visible without having to download any artifacts.
        with open(output, 'wb') as file:
            process = subprocess.Popen(command, stdout=subprocess.PIPE)
            for line in process.stdout:
                file.write(line)
                sys.stdout.buffer.write(line)
                sys.stdout.buffer.flush()
            returncode = process.wait()
        if returncode != 0:
            print(f'::error::staking-scripts {os.environ["SCRIPT_COMMAND"]} exited with code {returncode}')
        sys.exit(returncode)
