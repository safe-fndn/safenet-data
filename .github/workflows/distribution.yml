name: distribution

on:
  # Check for settled reward periods every three hours.
  schedule:
    - cron: '0 2-23/3 * * *'  # Every 3h at 02:00, 05:00, etc. UTC.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      settled: ${{ steps.status.outputs.settled }}
      periodEnd: ${{ steps.status.outputs.periodEnd }}

    steps:
      - uses: actions/checkout@v6

      - run: mkdir -p distribution

      - name: Resolve executed rewards distribution
        uses: ./.github/actions/staking-scripts
        with:
          command: status
          stdout-file: distribution/status.json

      - name: Read distribution status
        id: status
        run: |
          settled=$(jq -r '.settled' distribution/status.json)
          period_end=$(jq -er '.period.toTimestamp' distribution/status.json)
          [[ "$settled" =~ ^(true|false)$ && "$period_end" =~ ^[0-9]+$ ]]
          printf 'settled=%s\nperiodEnd=%s\n' "$settled" "$period_end" >> "$GITHUB_OUTPUT"
          if [[ "$settled" != true ]]; then
            echo "Period $period_end has not settled yet." >> "$GITHUB_STEP_SUMMARY"
          fi

  distribution:
    needs: status
    if: needs.status.outputs.settled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Safenet Database Cache
        uses: ./.github/actions/aegis-cache
        with:
          restore-only: 'true'

      - run: mkdir -p distribution/out

      - name: Export next distribution
        uses: ./.github/actions/staking-scripts
        with:
          command: export
          args: '["--out", "/workspace/distribution/out"]'
          # Keep stdout outside --out, which must be empty when export starts.
          stdout-file: distribution/export-summary.txt

      - name: Summarize exported distribution
        id: summary
        env:
          PERIOD_END: ${{ needs.status.outputs.periodEnd }}
        run: |
          test -f "distribution/out/rewards-$PERIOD_END.car"
          cid=$(cat distribution/out/cid.txt)
          [[ "$cid" =~ ^b[a-z2-7]+$ ]]
          echo "cid=$cid" >> "$GITHUB_OUTPUT"
          cat distribution/export-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Verify distribution and Reality.eth proposals
        uses: ./.github/actions/staking-scripts
        with:
          command: verify
          args: '["--cid", "${{ steps.summary.outputs.cid }}"]'
          stdout-file: distribution/verify-summary.txt

      - name: Summarize verified distribution
        run: |
          cat distribution/verify-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distribution bundle
        uses: actions/upload-artifact@v7
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: distribution
          retention-days: 3
          if-no-files-found: error
