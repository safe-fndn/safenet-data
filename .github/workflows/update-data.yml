# It pulls data from the chain using the safenet-staking-scripts Docker image
# and commits updated JSON assets back to the repo.
name: Update Safenet Data

on:
  schedule:
    - cron: '15 1-23/3 * * *'  # Every 3h at 01:15, 04:15, etc. UTC.
  workflow_dispatch:

# One run per branch at a time, so two runs never race on the push.
# A running job is never cancelled; a newer run replaces any run
# still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'data-update-main' || null }}
    # A run takes minutes, a cold start included. Fail a stuck run early, so it
    # does not hold up the run queued behind it until GitHub's 6h limit.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DATA_BOT_SSH_KEY }}

      # Restore the database maintained by index.yml without saving changes.
      - name: Safenet Database Cache
        uses: ./.github/actions/aegis-cache
        with:
          restore-only: 'true'

      # Fetch and index on-chain events into the local database. This must run
      # before any of the recording commands below.
      - name: Index Events
        uses: ./.github/actions/staking-scripts
        with:
          command: index
          debug: 'true'

      # Write network totals to assets/network-info.json.
      - name: Record Totals
        uses: ./.github/actions/staking-scripts
        with:
          command: totals
          args: '["--record", "/workspace"]'

      # Update participation rates in assets/validator-info.json and
      # assets/sentinel-info.json.
      - name: Participation Period
        id: period
        run: |
          end="$(date -d "$(date '+%H:00:00')" '+%s')"
          start="$((end - 1209600))"
          echo "computing participation for: $(date -d @$start) - $(date -d @$end)"
          printf 'start=%s\nend=%s\n' "$start" "$end" >> "$GITHUB_OUTPUT"

      - name: Record Participation
        uses: ./.github/actions/staking-scripts
        with:
          command: participation
          args: >-
            ["--record", "/workspace",
             "--rewardPeriodStart", "${{ steps.period.outputs.start }}",
             "--rewardPeriodEnd", "${{ steps.period.outputs.end }}"]

      # Commit any updated asset files back to the repo. Only run when updating
      # assets on the correct branch. This allows us to test workflows on PR
      # branches with cache and without unexpected update errors.
      - name: Commit Changes
        if: ${{ github.ref_name == 'main' }}
        run: |
          make fix
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/network-info.json assets/validator-info.json assets/sentinel-info.json
          git diff --staged --quiet || git commit -m "chore: update safenet data"
          git pull --rebase origin ${{ github.ref_name }}
          git push
