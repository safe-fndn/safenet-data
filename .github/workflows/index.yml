name: index

on:
  schedule:
    - cron: '23 1 * * *'  # Daily at 01:23
  workflow_dispatch:

concurrency:
  group: index-snapshot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/safe-fndn/safenet-staking-scripts:main
      ENV_FILE: config/aegis.env
      DATABASE_FILE: /workspace/safenet.aegis.db

    steps:
      - uses: actions/checkout@v6

      - name: Safenet Database Cache
        uses: actions/cache/restore@v4
        with:
          path: safenet.aegis.db
          key: safenet-aegis-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: safenet-aegis-db-

      - name: Index Events
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            --env-file "$ENV_FILE" \
            -e DATABASE_FILE \
            -e DEBUG='safenet,safenet:*' \
            "$IMAGE" \
            index

      # Steps run only on success by default, so failed indexes aren't archived.
      - name: Archive snapshot
        uses: actions/upload-artifact@v7
        with:
          name: index-snapshot-aegis-${{ github.run_id }}-${{ github.run_attempt }}
          path: safenet.aegis.db
          if-no-files-found: error
