name: index

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3h at 00:00, 03:00, etc. UTC.
  workflow_dispatch:

# One run per branch at a time so indexing runs never race on the cache.
# A running job is never cancelled; a newer run replaces any run still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Safenet Database Cache
        uses: ./.github/actions/aegis-cache

      - name: Index Events
        uses: ./.github/actions/staking-scripts
        with:
          command: index
          debug: 'true'

      # Steps run only on success by default, so failed indexes aren't archived.
      - name: Archive snapshot
        uses: actions/upload-artifact@v7
        with:
          name: index-snapshot-aegis-${{ github.run_id }}-${{ github.run_attempt }}
          path: safenet.aegis.db
          retention-days: 1
          if-no-files-found: error
